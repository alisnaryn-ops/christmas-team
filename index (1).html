<title>สุ่มทีม</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: one phone-first column in three steps. 1) confirm your name, 2) press the big button and
   watch the draw slow down onto a team, 3) result with teammate. Admin room sits at the bottom. */
:root {
  --bg: #f3f6f2;
  --surface: #ffffff;
  --fg: #14261b;
  --muted: #55665a;
  --line: #d9e1d6;
  --c-baseball: #c4262e;
  --c-aerobic: #1f7a45;
  --c-cheer: #b87500;
  --warn: #a15c00;
  --accent: #b3202a;
  --on-accent: #ffffff;
  --font-display: "Prompt", "Noto Sans Thai", system-ui, sans-serif;
  --font-body: "Noto Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1a13; --surface: #14241a; --fg: #eef5ee; --muted: #9db3a3; --line: #25402f;
    --c-baseball: #ff6b6b; --c-aerobic: #4cc27a; --c-cheer: #f4c542; --warn: #f0b04a; --accent: #cf2f3b; --on-accent: #ffffff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1a13; --surface: #14241a; --fg: #eef5ee; --muted: #9db3a3; --line: #25402f;
  --c-baseball: #ff6b6b; --c-aerobic: #4cc27a; --c-cheer: #f4c542; --warn: #f0b04a; --accent: #cf2f3b; --on-accent: #ffffff;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.6;
  padding-block: 28px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; min-width: 0; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 2rem; line-height: 1.2; margin: 0; text-wrap: balance; }
.lede { margin: 6px 0 0; color: var(--muted); font-size: 0.95rem; }
.label { font-size: 0.8rem; letter-spacing: 0.04em; color: var(--muted); font-weight: 500; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.field { display: flex; flex-direction: column; gap: 6px; }
select, input {
  font: inherit; color: var(--fg); background: var(--surface);
  border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; width: 100%;
}
select:focus-visible, input:focus-visible, button:focus-visible, summary:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
.go {
  font: inherit; font-family: var(--font-display); font-weight: 600; font-size: 1.05rem;
  background: var(--accent); color: var(--on-accent); border: 0; border-radius: 12px; padding: 14px 18px; cursor: pointer; width: 100%;
}
.go[disabled] { opacity: 0.45; cursor: not-allowed; }
.link { font: inherit; background: none; border: 0; color: var(--muted); cursor: pointer; padding: 4px 0; text-align: left; text-decoration: underline; width: fit-content; }
.msg { margin: 0; min-height: 1.4em; font-size: 0.9rem; color: var(--warn); }

.hello { color: var(--muted); }
.stripe { height: 10px; border-radius: 99px; margin-bottom: 16px; border: 1px solid var(--line); background: repeating-linear-gradient(-45deg, var(--accent) 0 12px, var(--surface) 12px 24px); }
.stage { text-align: left; display: flex; flex-direction: column; gap: 6px; min-height: 150px; justify-content: center; }
.stage .lead { color: var(--muted); font-size: 0.95rem; }
.stage .team { font-family: var(--font-display); font-weight: 700; font-size: 2.6rem; line-height: 1.2; overflow-wrap: anywhere; color: var(--fg); }
.stage .team.spin { color: var(--tc, var(--muted)); }
.stage .mates { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 4px; }
.chip { font-family: var(--font-display); font-weight: 600; border: 2px solid var(--tc, var(--line)); border-radius: 99px; padding: 2px 14px; }
.b { --tc: var(--c-baseball); } .a { --tc: var(--c-aerobic); } .c { --tc: var(--c-cheer); }

details { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 18px; }
summary { cursor: pointer; font-family: var(--font-display); font-weight: 600; }
.admin { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; }
.row { display: flex; gap: 8px; }
.row input { flex: 1; min-width: 0; }
.row .go { width: auto; padding-inline: 18px; }
.team-row { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; border-left: 6px solid var(--tc); margin-bottom: 8px; }
.team-row b { font-family: var(--font-display); }
.note { color: var(--muted); font-size: 0.82rem; margin: 0; }

.confetti { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 5; }
.confetti i { position: absolute; top: -20px; width: 9px; height: 14px; border-radius: 2px; animation: fall linear forwards; }
@keyframes fall { to { transform: translate3d(var(--dx, 0), 110vh, 0) rotate(720deg); } }
@media (prefers-reduced-motion: reduce) { .confetti { display: none; } }
</style>

<div class="confetti" id="confetti" aria-hidden="true"></div>
<main>
  <header>
    <div class="stripe" aria-hidden="true"></div>
    <h1>จับฉลากทีม</h1>
    <p class="lede">ลุ้นให้สุดว่าได้ทีมไหน มี 3 ทีม ทีมละ 2 คน</p>
  </header>

  <section class="card" id="stepName">
    <div class="field">
      <label class="label" for="who">เลือกชื่อของคุณ</label>
      <select id="who"></select>
    </div>
    <button type="button" class="go" id="confirm" disabled>ยืนยันชื่อของฉัน</button>
    <p class="note">เลือกชื่อตัวเองเท่านั้น เพื่อไม่ให้เพื่อนเสียความลุ้น</p>
  </section>

  <section class="card" id="stepDraw" hidden>
    <div class="hello" id="hello"></div>
    <div class="stage" aria-live="polite">
      <div class="lead" id="lead">พร้อมแล้วกดเลย</div>
      <div class="team" id="team">?</div>
      <div class="mates" id="mates"></div>
    </div>
    <button type="button" class="go" id="press">ลุ้นทีมของคุณ กด!</button>
    <button type="button" class="link" id="snd">เสียง: เปิด</button>
  </section>

  <details id="adminBox">
    <summary>ห้องผู้ควบคุม</summary>
    <div class="admin">
      <div class="field" id="codeField">
        <label class="label" for="code">ใส่รหัสเพื่อดูทุกทีม</label>
        <div class="row">
          <input id="code" type="password" inputmode="numeric" autocomplete="off" placeholder="รหัส">
          <button type="button" class="go" id="enter">เข้า</button>
        </div>
        <p class="msg" id="codeMsg" role="status"></p>
      </div>
      <div id="all" hidden></div>
    </div>
  </details>
</main>

  var TEAMS = {
    baseball: { name: "เบสบอล", cls: "b", color: "var(--c-baseball)" },
    aerobic: { name: "แอโรบิก", cls: "a", color: "var(--c-aerobic)" },
    cheer: { name: "เชียร์ลีดเดอร์", cls: "c", color: "var(--c-cheer)" }
  };
  var DRAW = {"ไบร์ท": "baseball", "สอาด": "baseball", "อิฐ": "aerobic", "ตุ๋ย": "aerobic", "ต้น": "cheer", "เอ้": "cheer"};
  var ADMIN_CODE = "2194";

  var $ = function (id) { return document.getElementById(id); };
  function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} return null; }
  var reduce = false;
  try { reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) {}

  var who = $("who"), confirmBtn = $("confirm"), press = $("press");
  var me = null, busy = false;

  // Sound: small synthesized tones, started only from a button press.
  var ctx = null, soundOn = ls("sound") !== "off";
  function audio() {
    if (!soundOn) return null;
    try {
      if (!ctx) { var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null; ctx = new AC(); }
      if (ctx.state === "suspended") ctx.resume();
    } catch (e) { return null; }
    return ctx;
  }
  function tone(freq, start, dur, type, vol) {
    var c = audio(); if (!c) return;
    try {
      var o = c.createOscillator(), g = c.createGain(), t = c.currentTime + start;
      o.type = type || "sine"; o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol || 0.15, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.02);
    } catch (e) {}
  }
  var sfx = {};
  function loadSfx(k) {
    var c = audio(); if (!c || !SFX[k] || sfx[k] !== undefined) return;
    sfx[k] = null;
    try {
      var bin = atob(SFX[k].split(",")[1]), arr = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      c.decodeAudioData(arr.buffer, function (b) { sfx[k] = b; }, function () {});
    } catch (e) {}
  }
  function playSfx(k) {
    var c = audio(); if (!c || !sfx[k]) return false;
    try {
      var src = c.createBufferSource(), g = c.createGain();
      src.buffer = sfx[k]; g.gain.value = 0.9; src.connect(g); g.connect(c.destination); src.start();
      return true;
    } catch (e) { return false; }
  }
  function beep(i, steps) { tone(420 + (i / steps) * 520, 0, 0.07, "square", 0.07); }
  function fanfare() {
    [523.25, 659.25, 783.99, 1046.5].forEach(function (f, i) { tone(f, i * 0.11, 0.28, "triangle", 0.17); });
    [523.25, 659.25, 783.99, 1046.5].forEach(function (f) { tone(f, 0.5, 0.8, "triangle", 0.1); });
  }

  var o0 = document.createElement("option"); o0.value = ""; o0.textContent = "เลือกชื่อ"; who.appendChild(o0);
  NAMES.forEach(function (n) { var o = document.createElement("option"); o.value = n; o.textContent = n; who.appendChild(o); });
  who.addEventListener("change", function () { confirmBtn.disabled = !who.value; });

  function show(step) { $("stepName").hidden = step !== "name"; $("stepDraw").hidden = step !== "draw"; }

  function resetStage() {
    $("lead").textContent = "พร้อมแล้วกดเลย";
    var t = $("team"); t.textContent = "?"; t.className = "team"; t.style.removeProperty("--tc");
    $("mates").innerHTML = "";
    press.textContent = "ลุ้นทีมของคุณ กด!";
  }

  function enter(name) {
    me = name; ls("me", name);
    $("hello").textContent = "สวัสดี " + name;
    show("draw");
    if (ls("done:" + name) === "1") showResult(name, false); else resetStage();
  }

  confirmBtn.addEventListener("click", function () { if (who.value) enter(who.value); });

  function burst() {
    if (reduce) return;
    var box = $("confetti"), colors = ["var(--c-baseball)", "var(--c-aerobic)", "var(--c-cheer)", "var(--fg)"];
    for (var i = 0; i < 40; i++) {
      var p = document.createElement("i");
      p.style.left = (Math.random() * 100) + "%";
      p.style.background = colors[i % colors.length];
      p.style.animationDuration = (2 + Math.random() * 1.8) + "s";
      p.style.animationDelay = (Math.random() * 0.4) + "s";
      p.style.setProperty("--dx", ((Math.random() - 0.5) * 120) + "px");
      box.appendChild(p);
    }
    setTimeout(function () { box.innerHTML = ""; }, 4600);
  }

  function showResult(name, celebrate) {
    var k = DRAW[name], t = TEAMS[k];
    var el = $("team");
    $("lead").textContent = "ยินดีด้วย! คุณอยู่ทีม";
    el.textContent = t.name; el.className = "team"; el.style.setProperty("--tc", t.color);
    var mates = NAMES.filter(function (n) { return n !== name && DRAW[n] === k; });
    var box = $("mates"); box.innerHTML = "";
    box.className = "mates " + t.cls;
    var lab = document.createElement("span"); lab.className = "lead"; lab.textContent = mates.length ? "เพื่อนร่วมทีม" : "ทีมนี้มีคุณคนเดียว"; box.appendChild(lab);
    mates.forEach(function (m) { var c = document.createElement("span"); c.className = "chip"; c.textContent = m; box.appendChild(c); });
    press.textContent = "เล่นอีกครั้ง";
    ls("done:" + name, "1");
    if (celebrate) { burst(); if (!playSfx(k)) fanfare(); }
  }

  function spin(name) {
    var real = DRAW[name], idx = KEYS.indexOf(real);
    var steps = 18, seq = [];
    for (var i = 0; i < steps; i++) seq.push(KEYS[(((idx - (steps - 1 - i)) % 3) + 3) % 3]);
    var el = $("team"), lead = $("lead"), i2 = 0;
    $("mates").innerHTML = "";
    lead.textContent = "กำลังลุ้น";
    busy = true; press.disabled = true;
    (function tick() {
      var t = TEAMS[seq[i2]];
      el.textContent = t.name; el.className = "team spin"; el.style.setProperty("--tc", t.color);
      i2++; beep(i2, steps);
      if (i2 >= steps) { setTimeout(function () { busy = false; press.disabled = false; showResult(name, true); }, 450); return; }
      setTimeout(tick, 70 + i2 * i2 * 1.4);
    })();
  }

  press.addEventListener("click", function () {
    if (!me || busy) return;
    audio(); loadSfx(DRAW[me]);
    if (reduce) { showResult(me, false); return; }
    spin(me);
  });

  var snd = $("snd");
  function sndLabel() { snd.textContent = "เสียง: " + (soundOn ? "เปิด" : "ปิด"); }
  snd.addEventListener("click", function () {
    soundOn = !soundOn; ls("sound", soundOn ? "on" : "off"); sndLabel();
    if (soundOn) beep(5, 10);
  });
  sndLabel();

  // Admin room
  function renderAll() {
    var box = $("all"); box.innerHTML = "";
    KEYS.forEach(function (k) {
      var t = TEAMS[k];
      var row = document.createElement("div"); row.className = "team-row " + t.cls;
      var b = document.createElement("b"); b.textContent = t.name;
      var p = document.createElement("span");
      p.textContent = NAMES.filter(function (n) { return DRAW[n] === k; }).join(", ");
      row.appendChild(b); row.appendChild(p); box.appendChild(row);
    });
    var n = document.createElement("p"); n.className = "note"; n.textContent = "รหัสนี้เป็นแค่ตัวกั้นเบา ๆ ไม่ได้ซ่อนผลจากคนที่ดูโค้ดหน้านี้เป็น"; box.appendChild(n);
    box.hidden = false; $("codeField").hidden = true;
  }
  $("enter").addEventListener("click", function () {
    if ($("code").value.trim() === ADMIN_CODE) { $("codeMsg").textContent = ""; renderAll(); }
    else { $("codeMsg").textContent = "รหัสไม่ถูกต้อง"; }
  });
  $("code").addEventListener("keydown", function (e) { if (e.key === "Enter") $("enter").click(); });

  var saved = ls("me");
  if (saved && NAMES.indexOf(saved) >= 0) enter(saved); else show("name");
})();
